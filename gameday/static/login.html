<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · gamedayParking</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
:root{--bg:#E6E5E0;--paper:#F4F3EE;--ink:#16212C;--mute:#5B6670;--line:#16212C;--acc:#F2C230;--bad:#B3261E;--ok:#1F7A4D}
@media (prefers-color-scheme:dark){:root{--bg:#14181D;--paper:#1D232A;--ink:#ECEAE3;--mute:#9AA5AF;--line:#4A5561;--bad:#FF8A80;--ok:#6FD3A0;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif}
header{padding:.9rem 1.2rem;border-bottom:4px dashed var(--acc);font:700 1.6rem 'Barlow Condensed',sans-serif}
main{max-width:460px;margin:0 auto;padding:2rem 1.2rem 4rem}
h1{font:700 2.4rem/1.05 'Barlow Condensed',sans-serif;margin:0 0 1rem}
.bay{background:var(--paper);border:2px solid var(--line);padding:1.1rem 1.2rem 1.3rem;border-radius:2px}
label{display:block;font-weight:500;margin:.8rem 0 .2rem}
input{width:100%;font:inherit;padding:.55rem .6rem;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:2px}
input.err{border-color:var(--bad)}
input:focus-visible,button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button{margin-top:1.1rem;background:var(--acc);color:#16212C;border:2px solid var(--ink);font:700 1.1rem 'Barlow Condensed',sans-serif;padding:.5rem 1.2rem;cursor:pointer;border-radius:2px}
button[disabled]{opacity:.6;cursor:wait}button.alt{background:transparent;color:var(--ink)}
.msg{margin-top:.9rem;font-weight:500}.msg.bad{color:var(--bad)}.mute{color:var(--mute)}
.tag{display:inline-block;border:1.5px solid var(--ink);padding:0 .45rem;font-size:.85rem}
</style>
</head>
<body>
<header>gamedayParking</header>
<main>
  <h1>Sign in</h1>
  <div class="bay" id="card"></div>
</main>
<script>
const card = document.getElementById("card");
const TOKEN_KEY = "gdp-token";

function showForm() {
  card.innerHTML = `
    <form id="f" novalidate>
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password">
      <button>Sign in</button>
      <div class="msg" id="msg" role="alert"></div>
      <p class="mute">New here? <a href="/register" style="color:inherit">Create an account</a></p>
      <p class="mute">Demo accounts: host1 or guest1, password <b>password1</b>.</p>
    </form>`;
  document.getElementById("f").addEventListener("submit", onSubmit);
}

async function onSubmit(e) {
  e.preventDefault();
  const f = e.target, msg = document.getElementById("msg"), btn = f.querySelector("button");
  const username = f.username.value.trim(), password = f.password.value;
  f.querySelectorAll("input").forEach(i => i.classList.remove("err"));
  msg.className = "msg"; msg.textContent = "";

  if (!username || !password) {
    msg.className = "msg bad"; msg.textContent = "Enter your username and password.";
    [f.username, f.password].forEach(i => !i.value.trim() && i.classList.add("err"));
    return;
  }
  btn.disabled = true;
  try {
    const res = await fetch("/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      msg.className = "msg bad";
      msg.textContent = typeof data.detail === "string" ? data.detail : "Couldn’t sign in. Check your details and try again.";
      f.username.classList.add("err"); f.password.classList.add("err");
      return;
    }
    localStorage.setItem(TOKEN_KEY, data.token);
    showWelcome(data.user);
  } catch (err) {
    msg.className = "msg bad"; msg.textContent = "Couldn’t reach the server. Is it running?";
  } finally {
    btn.disabled = false;
  }
}

function showWelcome(u) {
  card.innerHTML = `
    <h2 style="font:700 1.7rem 'Barlow Condensed',sans-serif;margin:0 0 .4rem"></h2>
    <p><span class="tag"></span></p>
    <p class="mute">You’re signed in. Your token is saved in this browser and sent as a Bearer header on API calls.</p>
    <button class="alt" id="out">Sign out</button>`;
  card.querySelector("h2").textContent = "Hi, " + u.name.split(" ")[0];
  card.querySelector(".tag").textContent = u.role;
  document.getElementById("out").onclick = () => { localStorage.removeItem(TOKEN_KEY); showForm(); };
}

// If a token is already saved, check it and skip the form
(async () => {
  const t = localStorage.getItem(TOKEN_KEY);
  if (t) {
    try {
      const r = await fetch("/me", { headers: { Authorization: "Bearer " + t } });
      if (r.ok) return showWelcome(await r.json());
    } catch (e) {}
    localStorage.removeItem(TOKEN_KEY);
  }
  showForm();
})();
</script>
</body>
</html>
