<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · gamedayParking</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500&family=Barlow+Condensed:wght@600;700&display=swap">

<link rel="stylesheet" href="/static/styles.css">

</head>
<body>
<header>gamedayParking</header>
<main>
  <h1>Sign in</h1>
  <div class="bay" id="card"></div>
</main>
<script>
  // api to render backend
const API = "https://gameday-parking.onrender.com";
const card = document.getElementById("card");
const TOKEN_KEY = "gdp-token";

function showForm() {
  card.innerHTML = `
    <form id="f" novalidate>
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password">
      <button>Sign in</button>
      <div class="msg" id="msg" role="alert"></div>
      <p class="mute">New here? <a href="/register" style="color:inherit">Create an account</a></p>
      <p class="mute">Demo accounts: host1 or guest1, password <b>password1</b>.</p>
    </form>`;
  document.getElementById("f").addEventListener("submit", onSubmit);
}

async function onSubmit(e) {
  e.preventDefault();
  const f = e.target, msg = document.getElementById("msg"), btn = f.querySelector("button");
  const username = f.username.value.trim(), password = f.password.value;
  f.querySelectorAll("input").forEach(i => i.classList.remove("err"));
  msg.className = "msg"; msg.textContent = "";

  if (!username || !password) {
    msg.className = "msg bad"; msg.textContent = "Enter your username and password.";
    [f.username, f.password].forEach(i => !i.value.trim() && i.classList.add("err"));
    return;
  }
  btn.disabled = true;
  try {
    const res = await fetch(`${API}/auth/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      msg.className = "msg bad";
      msg.textContent = typeof data.detail === "string" ? data.detail : "Couldn’t sign in. Check your details and try again.";
      f.username.classList.add("err"); f.password.classList.add("err");
      return;
    }
    localStorage.setItem(TOKEN_KEY, data.token);
    showWelcome(data.user);
  } catch (err) {
    msg.className = "msg bad"; msg.textContent = "Couldn’t reach the server. Is it running?";
  } finally {
    btn.disabled = false;
  }
}

function showWelcome(u) {
  card.innerHTML = `
    <h2 style="font:700 1.7rem 'Barlow Condensed',sans-serif;margin:0 0 .4rem"></h2>
    <p><span class="tag"></span></p>
    <p class="mute">You’re signed in. Your token is saved in this browser and sent as a Bearer header on API calls.</p>
    <button class="alt" id="out">Sign out</button>`;
  card.querySelector("h2").textContent = "Hi, " + u.name.split(" ")[0];
  card.querySelector(".tag").textContent = u.role;
  document.getElementById("out").onclick = () => { localStorage.removeItem(TOKEN_KEY); showForm(); };
}

// If a token is already saved, check it and skip the form
(async () => {
  const t = localStorage.getItem(TOKEN_KEY);
  if (t) {
    try {
      const r = await fetch("/me", { headers: { Authorization: "Bearer " + t } });
      if (r.ok) return showWelcome(await r.json());
    } catch (e) {}
    localStorage.removeItem(TOKEN_KEY);
  }
  showForm();
})();
</script>
</body>
</html>
