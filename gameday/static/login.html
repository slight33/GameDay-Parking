<!-- Header: Displays the brand name gamedayParking at the top.
 Main Container: Holds a heading (Sign in) and an empty <div> with id="card". The JavaScript code dynamically injects the login form or the user's welcome screen into this #card element.

<body>
<header>gamedayParking</header>
<main>
  <h1>Sign in</h1>
  <div class="bay" id="card"></div>
</main>
<!-- Grabs the #card element and sets a constant key name (gdp-token) for saving the user's login token in localStorage.
 showForm(): Replaces the HTML inside #card with a sign-in form containing username and password fields, a submit button, an error message container, and demo account hints (host1 or guest1).
 Attaches a submit event listener to the form to run onSubmit().
-->
 <!-- e.preventDefault(): Stops the browser from doing a traditional page reload on form submit.
 Validation: Checks if both username and password fields have text. If empty, it marks the inputs with an .err class and displays an error message.
 API Request: Sends a POST request to /auth/login with the username and password formatted as JSON.
 Error Handling: If the server returns an error (!res.ok), it displays the server's error message or a fallback message and highlights the input fields.
 Success: Saves the received authentication token into browser localStorage under gdp-token and calls showWelcome(data.user).
 Catch/Finally: Handles network failures and re-enables the submit button.
-->
<script>
  // api to render backend, left as "" so it uses the same server that served the page
const API = "";
const card = document.getElementById("card");
const TOKEN_KEY = "gdp-token";

function showForm() {
  card.innerHTML = `
    <form id="f" novalidate>
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password">
      <button>Sign in</button>
      <div class="msg" id="msg" role="alert"></div>
      <p class="mute">New here? <a href="/register" style="color:inherit">Create an account</a></p>
      <p class="mute">Demo accounts: host1 or guest1, password <b>password1</b>.</p>
    </form>`;
  document.getElementById("f").addEventListener("submit", onSubmit);
}

async function onSubmit(e) {
  e.preventDefault();
  const f = e.target, msg = document.getElementById("msg"), btn = f.querySelector("button");
  const username = f.username.value.trim(), password = f.password.value;
  f.querySelectorAll("input").forEach(i => i.classList.remove("err"));
  msg.className = "msg"; msg.textContent = "";

  if (!username || !password) {
    msg.className = "msg bad"; msg.textContent = "Enter your username and password.";
    [f.username, f.password].forEach(i => !i.value.trim() && i.classList.add("err"));
    return;
  }
  btn.disabled = true;
  try {
    const res = await fetch(`${API}/auth/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      msg.className = "msg bad";
      msg.textContent = typeof data.detail === "string" ? data.detail : "Couldn’t sign in. Check your details and try again.";
      f.username.classList.add("err"); f.password.classList.add("err");
      return;
    }
    localStorage.setItem(TOKEN_KEY, data.token);
    window.location.href = '/';
  } catch (err) {
    msg.className = "msg bad"; msg.textContent = "Couldn’t reach the server. Is it running?";
  } finally {
    btn.disabled = false;
  }
}
// showWelcome(u): Replaces the card contents with a greeting showing the user's first name, their role badge, and a Sign out button.
//Sign Out: Deletes the gdp-token from localStorage and re-renders the login form by calling showForm().

// If a token is already saved, check it and skip the form
function showWelcome(u) {
  card.innerHTML = `
    <h2 style="font:700 1.7rem 'Barlow Condensed',sans-serif;margin:0 0 .4rem"></h2>
    <p><span class="tag"></span></p>
    <p class="mute">You’re signed in. Your token is saved in this browser and sent as a Bearer header on API calls.</p>
    <button class="alt" id="out">Sign out</button>`;
  card.querySelector("h2").textContent = "Hi, " + u.name.split(" ")[0];
  card.querySelector(".tag").textContent = u.role;
  document.getElementById("out").onclick = () => { localStorage.removeItem(TOKEN_KEY); showForm(); };
}

// If a token is already saved, check it and skip the form
(async () => {
  const t = localStorage.getItem(TOKEN_KEY);
  if (t) {
    try {
      const r = await fetch("/me", { headers: { Authorization: "Bearer " + t } });
      if (r.ok) return showWelcome(await r.json());
    } catch (e) {}
    localStorage.removeItem(TOKEN_KEY);
  }
  showForm();
})();
// Runs immediately when the page loads.
// Checks if a saved token (gdp-token) already exists in localStorage.
// If a token exists, it pings the /me endpoint with a Bearer authorization header.
// If the token is valid, it skips the login form and goes straight to showWelcome().
// If invalid or missing, it clears any bad token and shows the login form via showForm().

</script>
</body>
