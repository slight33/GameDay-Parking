    while the cancellation rule allows it. my_bookings.js fills in the list.-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My bookings · GameDay Parking</title>
  <link rel="stylesheet" href="/static/home_style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="btn btn-ghost" href="/">&larr; All events</a>
      <span class="brand">GameDay Parking</span>
    </div>
  </header>

  <main class="page">
