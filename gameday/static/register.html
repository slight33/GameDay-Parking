<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create account · gamedayParking</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
:root{--bg:#E6E5E0;--paper:#F4F3EE;--ink:#16212C;--mute:#5B6670;--line:#16212C;--acc:#F2C230;--bad:#B3261E}
@media (prefers-color-scheme:dark){:root{--bg:#14181D;--paper:#1D232A;--ink:#ECEAE3;--mute:#9AA5AF;--line:#4A5561;--bad:#FF8A80;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif}
header{padding:.9rem 1.2rem;border-bottom:4px dashed var(--acc);font:700 1.6rem 'Barlow Condensed',sans-serif}
main{max-width:460px;margin:0 auto;padding:2rem 1.2rem 4rem}
h1{font:700 2.4rem/1.05 'Barlow Condensed',sans-serif;margin:0 0 1rem}
.bay{background:var(--paper);border:2px solid var(--line);padding:1.1rem 1.2rem 1.3rem;border-radius:2px}
label{display:block;font-weight:500;margin:.8rem 0 .2rem}
input{width:100%;font:inherit;padding:.55rem .6rem;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:2px}
input.err{border-color:var(--bad)}
input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button{margin-top:1.1rem;background:var(--acc);color:#16212C;border:2px solid var(--ink);font:700 1.1rem 'Barlow Condensed',sans-serif;padding:.5rem 1.2rem;cursor:pointer;border-radius:2px}
button[disabled]{opacity:.6;cursor:wait}
.msg{margin-top:.9rem;font-weight:500}.msg.bad{color:var(--bad)}.mute{color:var(--mute)}
a{color:var(--ink)}
</style>
</head>
<body>
<header>gamedayParking</header>
<main>
  <h1>Create account</h1>
  <div class="bay">
    <form id="f" novalidate>
      <label for="name">Full name</label>
      <input id="name" name="name" autocomplete="name">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email">
      <label for="phone">Phone</label>
      <input id="phone" name="phone" type="tel" autocomplete="tel">
      <label for="password">Password <span class="mute">(8+ characters)</span></label>
      <input id="password" name="password" type="password" autocomplete="new-password">
      <label for="confirm">Confirm password</label>
      <input id="confirm" name="confirm" type="password" autocomplete="new-password">
      <button>Create account</button>
      <div class="msg" id="msg" role="alert"></div>
      <p class="mute">Already have an account? <a href="/login">Sign in</a></p>
    </form>
  </div>
</main>
<script>
// api to the render backend
const API = "https://gameday-parking.onrender.com/"
const f = document.getElementById("f"), msg = document.getElementById("msg");
const FIELDS = ["name", "username", "email", "phone", "password"];

function fail(text, names = []) {
  msg.className = "msg bad"; msg.textContent = text;
  names.forEach(n => f[n].classList.add("err"));
}

f.addEventListener("submit", async e => {
  e.preventDefault();
  const btn = f.querySelector("button");
  f.querySelectorAll("input").forEach(i => i.classList.remove("err"));
  msg.className = "msg"; msg.textContent = "";

  const body = {};
  FIELDS.forEach(n => body[n] = f[n].value.trim());
  body.password = f.password.value;

  const empty = FIELDS.filter(n => !body[n]);
  if (empty.length) return fail("Fill in every field.", empty);
  if (!/^\S+@\S+\.\S+$/.test(body.email)) return fail("Enter a valid email address.", ["email"]);
  if (body.password.length < 8) return fail("Password needs at least 8 characters.", ["password"]);
  if (body.password !== f.confirm.value) return fail("Passwords don’t match.", ["password", "confirm"]);

  btn.disabled = true;
  try {
    const res = await fetch(`${API}/auth/signup`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      // 409 gives a string message; 422 gives a list of field errors
      if (typeof data.detail === "string") {
        const hit = res.status === 409 ? [/username/i.test(data.detail) ? "username" : "email"] : [];
        return fail(data.detail, hit);
      }
      const bad = Array.isArray(data.detail) ? data.detail.map(d => d.loc[d.loc.length - 1]) : [];
      return fail("Check the highlighted fields and try again.", bad.filter(n => FIELDS.includes(n)));
    }
    localStorage.setItem("gdp-token", data.token);
    window.location.href = "/login";   // login page shows the signed-in card
  } catch (err) {
    fail("Couldn’t reach the server. Is it running?");
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
